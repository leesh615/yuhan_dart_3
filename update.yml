name: Update Yuhan DART Financials
on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1"
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Collect and analyze
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_CORP_CODE: ${{ secrets.DART_CORP_CODE }}
          DART_FS_DIV: CFS
          DART_YEARS: 2020,2021,2022,2023,2024,2025
        run: |
          cd src
          python pipeline.py
          cd ..
          python dashboard/generate.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed dashboard/index.html
          git diff --cached --quiet || git commit -m "Update DART financial data"
          git push
